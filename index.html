<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>StormLab. - Design & Development</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #CDCECF;
      /* Initial bg color matching hero */
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Smooth scroll setup */
    html.lenis,
    html.lenis body {
      height: auto;
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }

    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }

    .lenis.lenis-stopped {
      overflow: hidden;
    }

    .lenis.lenis-scrolling iframe {
      pointer-events: none;
    }

    /* NEUMORPHIC INSET TEXT */
    .text-neumorph-inset {
      color: #e0e5ec;
      text-shadow: 2px 2px 2px rgba(255, 255, 255, 1), -2px -2px 2px rgba(163, 177, 198, 0.6);
    }

    .text-neumorph-pressed {
      color: transparent;
      background-color: #e0e5ec;
      background-clip: text;
      -webkit-background-clip: text;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5), -2px -2px 4px rgba(112, 128, 144, 0.5);
      /* Attempt at engraved look */
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'GraphikLCG', 'Arial', 'sans-serif'],
            display: ['Oswald', 'Inter', 'sans-serif'],
            serif: ['"Playfair Display"', '"Times New Roman"', 'serif'],
          },
          colors: {
            'agency-gray': '#ffffff',
            'agency-black': '#000000',
            'storm-lime': '#ccff00',
            'storm-lavender': '#d8b4fe',
            'storm-cyan': '#22d3ee',
          }
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "gsap/": "https://aistudiocdn.com/gsap@^3.13.0/",
    "gsap": "https://aistudiocdn.com/gsap@^3.13.0",
    "lenis": "https://aistudiocdn.com/lenis@^1.3.15",
    "@gsap/react": "https://aistudiocdn.com/@gsap/react@^2.1.2",
    "react-icons/": "https://esm.sh/react-icons@5.4.0/",
    "react-icons": "https://esm.sh/react-icons@5.4.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
